name: Windows Rust check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  affected-crates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build desktop sidecars for Tauri check
        run: cargo build --target x86_64-pc-windows-msvc -p hitch-daemon -p hitch-hook
      - name: Check affected Rust crates on Windows
        run: cargo check --target x86_64-pc-windows-msvc -p hitch-proto -p hitch-daemon -p hitch-desktop
      - name: Build Windows Tauri package
        working-directory: apps/desktop
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
        run: bun tauri build --target x86_64-pc-windows-msvc --features packaged-smoke
      - name: Verify Windows installer was bundled
        shell: pwsh
        run: |
          $bundle = "target/x86_64-pc-windows-msvc/release/bundle"
          $installers = Get-ChildItem -Path $bundle -Recurse -File -Include *.exe, *.msi -ErrorAction SilentlyContinue
          if (-not $installers) {
            # The uploaded artifact also globs the raw release/*.exe build outputs
            # (hitch-daemon.exe, hitch-hook.exe, hitch-desktop.exe), so
            # `if-no-files-found: error` on the upload step can't catch a missing
            # installer on its own. Fail here so a "Windows package" artifact is
            # never published without an actual packaged app.
            Write-Error "No Windows installer (.exe/.msi) found under $bundle"
            exit 1
          }
          Write-Host "Bundled installer(s):"
          $installers | ForEach-Object { Write-Host "  $($_.FullName)" }
      - name: Smoke-test Windows package
        if: ${{ hashFiles('apps/desktop/scripts/smoke-windows-package.ps1') != '' }}
        shell: pwsh
        env:
          HITCH_INSTANCE: ci-smoke
          HITCH_PACKAGED_SMOKE_TEST: "1"
        run: >
          apps/desktop/scripts/smoke-windows-package.ps1
          -ExePath target/x86_64-pc-windows-msvc/release/hitch-desktop.exe
      - name: Upload Windows package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hitch-windows-x86_64
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/**
