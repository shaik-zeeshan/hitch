name: Tests

# The Windows workflow (windows-rust-check.yml) only does `cargo check`/`build`
# plus an installer smoke test. This workflow actually *runs* the test suites —
# the frontend vitest specs and the Rust workspace tests (incl. the daemon
# proxy/reattach integration tests) — on Linux, so regressions are caught in CI.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Run vitest
        working-directory: apps/desktop
        run: bun run test

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The src-tauri crate (hitch-desktop) is part of the workspace, so building
      # it for `cargo test --workspace` pulls in Tauri's Linux GUI dependencies.
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev
      # Build the daemon + hook sidecars first: the daemon integration tests
      # (proxy/reattach) spawn the hitch-daemon binary, mirroring `bun run rust:test`.
      #
      # `--test-threads=1`: a few tests assert an operation finishes inside a
      # 10s wall-clock bound (hitch-git disarm-before-join watchdog, hitch-daemon
      # drafts SUCCESS_DRAIN_GRACE). Run fully parallel on a 2-core runner they
      # starve and blow the ceiling — a false timeout, not a real failure. A
      # genuine deadlock/regression still hangs past the watchdog, so serial
      # execution keeps the assertion meaningful while removing the flake.
      - name: Build sidecars and run workspace tests
        run: cargo build -p hitch-daemon -p hitch-hook && cargo test --workspace -- --test-threads=1
