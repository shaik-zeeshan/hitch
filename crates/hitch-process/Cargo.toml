[package]
name = "hitch-process"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Kill-the-whole-tree process primitives: Unix process groups, Win32 Job Objects."

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
