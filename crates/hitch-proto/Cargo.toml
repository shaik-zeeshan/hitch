[package]
name = "hitch-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Hitch IPC wire contract: message enum, PTY framing, and socket transport scaffolding."

[dependencies]
hitch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Base64 for the ssh-agent relay: raw agent wire bytes are binary, but the
# control channel is newline-framed JSON, so SshAgentData carries them encoded.
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
interprocess = "2.4.2"
# For building the named-pipe security descriptor from an SDDL string. Pinned to
# the same 1.x line interprocess already depends on, so `U16CString` matches the
# `&U16CStr` that `SecurityDescriptor::deserialize` expects.
widestring = "1"
