[package]
name = "hitch-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Hitch IPC wire contract: message enum, PTY framing, and socket transport scaffolding."

[dependencies]
hitch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Base64 for the ssh-agent relay: raw agent wire bytes are binary, but the
# control channel is newline-framed JSON, so SshAgentData carries them encoded.
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
interprocess = "2.4.2"
# For building the named-pipe security descriptor from an SDDL string. Pinned to
# the same 1.x line interprocess already depends on, so `U16CString` matches the
# `&U16CStr` that `SecurityDescriptor::deserialize` expects.
widestring = "1"
# CancelIoEx + DisconnectNamedPipe, to force-unblock a relay pump thread parked in
# ReadFile on a named-pipe handle AND break the pipe so the next read also fails
# (ssh-agent relay teardown, ADR 0014 amendment). Pinned to the 0.60.2 line
# hitch-process already uses to avoid a third windows-sys version.
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Pipes"] }
