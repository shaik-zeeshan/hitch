[package]
name = "hitch-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Hitch desktop app — thin Tauri client (ADR 0005)."

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin so it does not
# conflict on Windows (see rust-lang/cargo#8519).
name = "hitch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Compiles in the destructive packaged smoke-test harness (creates a temp
# project, opens/closes a session, removes the project, shuts down the daemon,
# then exits the process). Off by default so it never ships in production
# builds; CI enables it for the Windows package smoke build.
packaged-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Thin client (ADR 0005): depends only on `hitch-proto` (+ `hitch-core`) and
# routes every operation through the daemon socket. No feature-crate logic here.
# The daemon wiring lands in slice 8; the deps are declared now to fix the graph.
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# OS-integration plugins (slice 7–8 follow-up): opener powers "Reveal in
# Finder" and "Open in editor" (openPath with an app name); dialog powers the
# add-project folder picker. Pure frontend↔plugin calls — no daemon requests.
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Native desktop notifications: the frontend posts agent-state banners through
# the plugin's JS API. Pure frontend↔plugin call — no daemon request.
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
hitch-core.workspace = true
hitch-proto.workspace = true
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Frameless-window subclassing reads the raw HWND from the Tauri window handle
# (window_chrome.rs); raw-window-handle 0.6 is the version Tauri 2 already uses.
raw-window-handle = "0.6"

# macOS-only: at startup we register `ApplePressAndHoldEnabled = NO` via Cocoa so
# WKWebView lets keys repeat (see lib.rs `run`). These are already in the tree
# (pulled by Tauri/wry); pinned to the resolved versions to avoid a duplicate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSDictionary", "NSString", "NSValue"] }

# System font enumeration for the Settings terminal-font picker
# (`list_monospace_fonts`). Native backends only (Core Text / DirectWrite);
# not pulled in on Linux, where it would drag in freetype + fontconfig —
# the command returns an empty list there and the picker hides itself.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
font-kit = "0.14"
